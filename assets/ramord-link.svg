<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Glowing Ethernet Connector Base (Left Node) -->
  <rect x="100" y="270" width="110" height="120" rx="22" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="8"/>
  <rect x="122" y="250" width="66" height="24" rx="6" fill="#3b82f6"/>
  <path d="M125 310 h60 M125 334 h60 M125 358 h60" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

  <!-- Computer Screen Display (Right Node) -->
  <rect x="290" y="230" width="130" height="95" rx="16" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="8"/>
  <rect x="306" y="246" width="98" height="63" rx="8" fill="#0f172a"/>
  <!-- Screen Stand -->
  <path d="M355 325 v35 M330 360 h50" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Central Dynamic Link Wave / Bridge -->
  <path d="M155 250 C 155 130, 355 130, 355 230" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 0" filter="url(#glow)"/>

  <!-- Wi-Fi Waves radiating from Bridge top -->
  <circle cx="256" cy="195" r="14" fill="#10b981" filter="url(#glow)"/>
  <path d="M226 165 A 42 42 0 0 1 286 165" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
  <path d="M206 142 A 70 70 0 0 1 306 142" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <path d="M186 119 A 98 98 0 0 1 326 119" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>

  <!-- Data Flow Particles -->
  <circle cx="210" cy="180" r="5" fill="#ffffff"/>
  <circle cx="302" cy="180" r="5" fill="#ffffff"/>
</svg>
