<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#102127"/>
      <stop offset="45%" stop-color="#0b171b"/>
      <stop offset="85%" stop-color="#071013"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14c8b2"/>
      <stop offset="100%" stop-color="#005a48"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18e0c8"/>
      <stop offset="100%" stop-color="#14c8b2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Obsidian Dark Turquoise subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="#14c8b2" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Ethernet Connector Base (Left Node) -->
  <rect x="100" y="270" width="110" height="120" rx="22" fill="#0b171b" stroke="#14c8b2" stroke-opacity="0.4" stroke-width="6"/>
  <rect x="122" y="250" width="66" height="24" rx="6" fill="#14c8b2"/>
  <path d="M125 310 h60 M125 334 h60 M125 358 h60" stroke="#005a48" stroke-width="6" stroke-linecap="round"/>

  <!-- Computer Screen Display (Right Node) -->
  <rect x="290" y="230" width="130" height="95" rx="16" fill="#0b171b" stroke="url(#primaryGrad)" stroke-width="6"/>
  <rect x="306" y="246" width="98" height="63" rx="8" fill="#071013"/>
  <!-- Screen Stand -->
  <path d="M355 325 v35 M330 360 h50" stroke="#14c8b2" stroke-width="6" stroke-linecap="round"/>

  <!-- Central Dynamic Link Bridge Wave -->
  <path d="M155 250 C 155 130, 355 130, 355 230" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Wi-Fi Waves radiating from Bridge apex -->
  <circle cx="256" cy="195" r="14" fill="#14c8b2" filter="url(#glow)"/>
  <path d="M226 165 A 42 42 0 0 1 286 165" fill="none" stroke="#14c8b2" stroke-width="7" stroke-linecap="round"/>
  <path d="M206 142 A 70 70 0 0 1 306 142" fill="none" stroke="#18e0c8" stroke-width="7" stroke-linecap="round"/>
  <path d="M186 119 A 98 98 0 0 1 326 119" fill="none" stroke="#14c8b2" stroke-opacity="0.6" stroke-width="7" stroke-linecap="round"/>

  <!-- Data Flow Particles -->
  <circle cx="210" cy="180" r="5" fill="#f3f8f8"/>
  <circle cx="302" cy="180" r="5" fill="#f3f8f8"/>
</svg>
